services:
  postgres:
    image: postgres:16-alpine
    container_name: office-world-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: office_world
      POSTGRES_USER: office_world
      POSTGRES_PASSWORD: office_world
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
